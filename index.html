<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1d5f31">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RC Gado">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>RC Gado</title>
<style>
:root { --bg:#f1f4ee; --surface:#fff; --ink:#15231a; --muted:#56665b; --line:#d2dacd; --green:#1d5f31; --gink:#fff; --danger:#b3261e; --warn:#a84b00; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1711; --surface:#17221a; --ink:#e9f0e5; --muted:#9cae9f; --line:#2b3b2f; --green:#2f8c4a; --danger:#f2877f; --warn:#f2a45c; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
body { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top, 0px); }
.frames { flex: 1; position: relative; min-height: 0; }
.frames iframe, .frames .panel { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.frames [hidden] { display: none !important; }
.panel { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 24px; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { border: 0; background: none; color: var(--muted); min-height: 54px; font: 700 12px/1.2 inherit; display: grid; place-items: center; gap: 2px; padding: 6px 0; letter-spacing: .02em; }
.tabbar button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-selected="true"] { color: var(--green); }
.tabbar button[aria-selected="true"] span { border-bottom: 2px solid var(--green); }
h1 { font-size: 24px; margin: 4px 0 2px; }
h2 { font-size: 16px; margin: 0 0 8px; }
p { margin: 0 0 10px; line-height: 1.4; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; min-height: 46px; padding: 0 16px; background: var(--green); color: var(--gink); font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }
.btn.alt { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { min-height: 38px; font-size: 14px; padding: 0 12px; }
.btn.block { width: 100%; }
.cnt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.cnt div { background: var(--bg); border-radius: 10px; padding: 10px 4px; }
.cnt b { display: block; font-size: 22px; }
.cnt span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.snap { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.snap:first-of-type { border-top: 0; }
.msg { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-size: 14px; white-space: pre-line; }
.msg.ok { border-left: 4px solid var(--green); } .msg.err { border-left: 4px solid var(--danger); }
.aviso { color: var(--warn); font-weight: 700; }
</style></head>
<body>
<div class="frames">
  <iframe id="f-emb" src="embarques.html" title="Embarque" hidden></iframe>
  <iframe id="f-aba" src="abate.html" title="Abate" hidden></iframe>
  <section class="panel" id="p-bkp" hidden></section>
</div>
<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="emb"><svg viewBox="0 0 24 24"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/></svg><span>Embarque</span></button>
  <button role="tab" data-tab="aba"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11zM9 20v-6h6v6"/></svg><span>Abate</span></button>
  <button role="tab" data-tab="bkp"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg><span>Backup</span></button>
</nav>
<script>
(function () {
  'use strict';
  var EK = 'rc_embarques_v1', AK = 'abate.v1', LK = 'rcgado.ultimoBackup', TK = 'rcgado.aba';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var panes = { emb: $('#f-emb'), aba: $('#f-aba'), bkp: $('#p-bkp') };
  var cur = 'emb';

  function go(t) {
    if (!panes[t]) t = 'emb'; cur = t;
    Object.keys(panes).forEach(function (k) { panes[k].hidden = k !== t; });
    document.querySelectorAll('.tabbar button').forEach(function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === t)); });
    try { localStorage.setItem(TK, t); } catch (e) {}
    if (t === 'bkp') renderBkp();
    if (t === 'aba') { try { $('#f-aba').contentWindow.RC_ABATE.atualizar(); } catch (e) {} }
  }
  document.querySelector('.tabbar').addEventListener('click', function (e) { var b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab); });
  window.irPara = go;

  /* ---------- ponte embarque -> abate ---------- */
  var MAPA = { B: 'boi', C: 'boi', N: 'novilha', V: 'vaca', L: 'vaca', M: 'touro' };
  function rendDe(l, f, c) {
    var k = c.cat, fz = c.fz || f.faz, v = f.rend && f.rend[k];
    if (v !== undefined && v !== null && v !== '' && +v > 0) return +v;
    var w = l.fazRend && fz && l.fazRend[fz] && l.fazRend[fz][k];
    if (w !== undefined && w !== null && w !== '' && +w > 0) return +w;
    return +((l.cats && l.cats[k] && l.cats[k].rend) || 0);
  }
  function r2(x) { return Math.round(x * 100) / 100; }
  function grupos(id) {
    var l = readE().lotes.filter(function (x) { return x.id === id; })[0]; if (!l) return null;
    var cats = {}, nomes = [];
    (l.fazendas || []).forEach(function (z) { if (z.nome) nomes.push(z.nome); });
    (l.folhas || []).forEach(function (f) { (f.cells || []).forEach(function (c) {
      var k = MAPA[c.cat]; if (!k) return;
      var r = rendDe(l, f, c), x = cats[k] || (cats[k] = { q: 0, pf: 0, pct: [], grupos: [], _pp: 0, _pw: 0 });
      x.q += c.n; x.pf += c.w; var pz = +((l.cats && l.cats[c.cat] && l.cats[c.cat].preco) || 0); if (pz > 0) { x._pp += pz * c.w; x._pw += c.w; }
      var g = x.grupos.filter(function (y) { return y.rend === r; })[0];
      if (!g) { g = { q: 0, pf: 0, rend: r }; x.grupos.push(g); if (r > 0 && x.pct.indexOf(r) < 0) x.pct.push(r); }
      g.q += c.n; g.pf += c.w;
    }); });
    Object.keys(cats).forEach(function (k) { cats[k].preco = cats[k]._pw ? r2(cats[k]._pp / cats[k]._pw) : 0; delete cats[k]._pp; delete cats[k]._pw; cats[k].pf = r2(cats[k].pf); cats[k].grupos.forEach(function (g) { g.pf = r2(g.pf); }); });
    return { frig: l.frigorifico || '', id: l.id, nome: (l.pecuarista || 'Sem pecuarista') + ' · ' + (nomes.join(', ') || 'romaneio'), pecuarista: l.pecuarista || '', data: l.data, cats: cats };
  }
  function romaneios() {
    return readE().lotes.map(function (l) {
      var cab = 0, peso = 0; (l.folhas || []).forEach(function (f) { (f.cells || []).forEach(function (c) { cab += c.n; peso += c.w; }); });
      var nomes = (l.fazendas || []).map(function (z) { return z.nome; }).filter(Boolean);
      return { frig: l.frigorifico || '', id: l.id, data: l.data, pec: l.pecuarista || '', fazs: nomes.join(', '), cab: cab, peso: peso };
    }).filter(function (r) { return r.cab > 0; }).sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
  }
  function progs() {
    var E = readE();
    return E.progs.map(function (pr) {
      var m = 0, f = 0; (pr.itens || []).forEach(function (it) { m += +it.B || 0; f += (+it.V || 0) + (+it.N || 0) + (+it.F || 0); });
      var pesado = E.lotes.some(function (l) { return l.progId === pr.id || !l.progId && l.data === pr.data && (!pr.pecuarista || !l.pecuarista || nrm(pr.pecuarista) === nrm(l.pecuarista)) && (l.folhas || []).some(function (f) { return (f.cells || []).length; }); });
      return { id: pr.id, data: pr.data, pec: pr.pecuarista || '', frig: pr.frigorifico || '', m: m, f: f, cab: m + f, pesado: pesado };
    }).filter(function (p) { return p.cab > 0; });
  }
  function nrm(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
  function nomes(kind) {
    var E = readE(), A = readA(), seen = {}, out = [];
    function add(n) { n = String(n || '').trim().replace(/\s+/g, ' '); if (n.length < 2) return; var k = nrm(n); if (seen[k]) return; seen[k] = 1; out.push(n); }
    if (kind === 'pec') { E.lotes.forEach(function (l) { add(l.pecuarista); }); E.progs.forEach(function (p) { add(p.pecuarista); }); Object.keys(A).forEach(function (i) { add(A[i].pecuarista); }); }
    else if (kind === 'frig') { E.lotes.forEach(function (l) { add(l.frigorifico); }); E.progs.forEach(function (p) { add(p.frigorifico); }); Object.keys(A).forEach(function (i) { add(A[i].frigorifico); }); }
    else { E.lotes.forEach(function (l) { (l.fazendas || []).forEach(function (z) { add(z.nome); }); }); E.progs.forEach(function (p) { (p.itens || []).forEach(function (i) { add(i.faz); }); }); }
    return out.sort(function (a, b) { return a.localeCompare(b, 'pt-BR', { sensitivity: 'base' }); });
  }
  function abateWin() { return $('#f-aba').contentWindow; }
  window.RC = {
    romaneios: romaneios, grupos: grupos, progs: progs, nomes: nomes,
    ligados: function (id) { try { return abateWin().RC_ABATE.ligados(id); } catch (e) { return []; } },
    frigorifico: function () { try { return abateWin().RC_ABATE.frigorifico(); } catch (e) { return ''; } },
    enviar: async function (id, data, frig) { go('aba'); try { return await abateWin().RC_ABATE.novoDoRomaneio({ id: id, data: data, frigorifico: frig }); } catch (e) { return false; } },
    abrirAbate: async function (id) { go('aba'); try { return await abateWin().RC_ABATE.abrir(id); } catch (e) { return false; } }
  };

  /* ---------- leitura/escrita dos dois bancos (mesma origem) ---------- */
  function readE() { try { var d = JSON.parse(localStorage.getItem(EK)); if (d && Array.isArray(d.lotes)) { d.progs = Array.isArray(d.progs) ? d.progs : []; return d; } } catch (e) {} return { lotes: [], progs: [] }; }
  function readA() { try { var m = JSON.parse(localStorage.getItem(AK)); return (m && m.recs) || {}; } catch (e) { return {}; } }
  function writeE(d) { localStorage.setItem(EK, JSON.stringify(d)); }
  function writeA(recs) { localStorage.setItem(AK, JSON.stringify({ recs: recs })); }
  var realE = function (d) { return d.lotes.filter(function (l) { return !l.exemplo; }); };
  function counts() { var e = readE(), a = readA(); return { rom: realE(e).length, prog: e.progs.length, aba: Object.keys(a).length }; }
  function recarregar() { ['f-emb', 'f-aba'].forEach(function (id) { try { $('#' + id).contentWindow.location.reload(); } catch (e) { $('#' + id).src = $('#' + id).src; } }); }

  /* ---------- cópias automáticas (1 por dia, 30 dias) ---------- */
  function hoje() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function idb() { return new Promise(function (res, rej) { if (!window.indexedDB) return rej(); var q = indexedDB.open('rcgado-bkp', 1); q.onupgradeneeded = function () { q.result.createObjectStore('snaps', { keyPath: 'dia' }); }; q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(); }; }); }
  function snapSave(tag) {
    var c = counts(); if (!c.rom && !c.prog && !c.aba) return Promise.resolve();
    var rec = { dia: hoje() + (tag ? '~' + tag : ''), ts: Date.now(), c: c, e: readE(), a: readA() };
    return idb().then(function (db) { return new Promise(function (res) { var st = db.transaction('snaps', 'readwrite').objectStore('snaps'); st.put(rec); st.getAllKeys().onsuccess = function (ev) { var ks = ev.target.result.sort(); while (ks.length > 30) st.delete(ks.shift()); }; db.transaction('snaps').oncomplete = res; setTimeout(res, 400); }); }).catch(function () {});
  }
  function snapList() { return idb().then(function (db) { return new Promise(function (res) { var out = [], q = db.transaction('snaps').objectStore('snaps').openCursor(); q.onsuccess = function () { var c = q.result; if (c) { out.push({ dia: c.value.dia, ts: c.value.ts, c: c.value.c }); c.continue(); } else res(out.sort(function (a, b) { return a.dia < b.dia ? 1 : -1; })); }; q.onerror = function () { res([]); }; }); }).catch(function () { return []; }); }
  function snapGet(dia) { return idb().then(function (db) { return new Promise(function (res) { var q = db.transaction('snaps').objectStore('snaps').get(dia); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(null); }; }); }).catch(function () { return null; }); }
  setTimeout(function () { snapSave(); }, 4000);
  setInterval(function () { if (!document.hidden) snapSave(); }, 180000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) snapSave(); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  /* ---------- salvar arquivo (menu de compartilhar do iPhone) ---------- */
  async function salvarArquivo(nome, texto) {
    try {
      var file = new File([texto], nome, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: nome }); return true; } catch (e) { if (e && e.name === 'AbortError') return false; } }
    } catch (e) {}
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([texto], { type: 'application/json' })); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); return true;
  }
  async function exportar() {
    var j = { app: 'rcgado', versao: 1, exportado: new Date().toISOString(), embarques: { lotes: realE(readE()), progs: readE().progs }, abate: readA() };
    var ok = await salvarArquivo('rc-gado-backup-' + hoje() + '.json', JSON.stringify(j));
    if (ok) { try { localStorage.setItem(LK, String(Date.now())); } catch (e) {} await renderBkp(); msg('Backup geral salvo. Guarde o arquivo no app Arquivos ou envie para você mesmo.', true); }
  }

  /* ---------- importar (aceita o backup geral e os dois backups antigos) ---------- */
  function mergeE(src) {
    var d = readE(); var n = { rom: 0, prog: 0, ja: 0 };
    if (d.lotes.every(function (l) { return l.exemplo; })) d.lotes = [];
    var ids = {}; d.lotes.forEach(function (l) { ids[l.id] = 1; });
    function nz(x) { return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim().replace(/ iii$/, ' 3').replace(/ ii$/, ' 2'); }
    function repor(l) {
      var old = null, b = nz(l.pecuarista);
      d.lotes.forEach(function (o) { if (o.exemplo) return; var a = nz(o.pecuarista); if (!(a === b || a.indexOf(b) === 0 || b.indexOf(a) === 0)) return; var dd = Math.abs(new Date(o.data) - new Date(l.data)) / 864e5; if (dd <= 2 && (!old || (o.criado || 0) > (old.criado || 0))) old = o; });
      delete l.repor; if (!old) return false;
      var map = {}; (l.fazendas || []).forEach(function (z) { (old.fazendas || []).forEach(function (oz) { if (nz(oz.nome) === nz(z.nome)) map[z.id] = oz.id; }); });
      var mp = function (id) { return map[id] || id; };
      l.fazendas.forEach(function (z) { z.id = mp(z.id); });
      l.folhas.forEach(function (f) { f.faz = mp(f.faz); f.cells.forEach(function (c) { if (c.fz) c.fz = mp(c.fz); }); });
      ['progId', 'frigorifico', 'comprador', 'obs', 'cats', 'funrural', 'senar', 'ajuste', 'pecuarista', 'data', 'criado', 'separar', 'modo'].forEach(function (k) { if (old[k] !== undefined) l[k] = old[k]; });
      if (old.fazRend) { l.fazRend = {}; Object.keys(old.fazRend).forEach(function (k) { if (l.fazendas.some(function (z) { return z.id === k; })) l.fazRend[k] = old.fazRend[k]; }); }
      l.id = old.id; d.lotes[d.lotes.indexOf(old)] = l; return true;
    }
    (src.lotes || []).forEach(function (l) { if (!l || !l.id || l.exemplo) return; if (l.repor && repor(l)) { n.rom++; return; } delete l.repor; if (ids[l.id]) n.ja++; else { d.lotes.push(l); ids[l.id] = 1; n.rom++; } });
    var pids = {}; d.progs.forEach(function (p) { pids[p.id] = 1; });
    (src.progs || []).forEach(function (p) { if (!p || !p.id) return; if (pids[p.id]) n.ja++; else { d.progs.push(p); pids[p.id] = 1; n.prog++; } });
    if (n.rom || n.prog) writeE(d); return n;
  }
  function mergeA(recs) {
    var a = readA(), n = { aba: 0, ja: 0 };
    Object.keys(recs || {}).forEach(function (id) { var r = recs[id]; if (!r || typeof r !== 'object' || !r.data || !Array.isArray(r.lotes)) return; if (a[id]) n.ja++; else { r.id = id; a[id] = r; n.aba++; } });
    if (n.aba) writeA(a); return n;
  }
  async function importar(files) {
    var out = [], tot = { rom: 0, prog: 0, aba: 0, ja: 0 }, erro = [];
    await snapSave('antes');
    for (var i = 0; i < files.length; i++) {
      var f = files[i], j;
      try { j = JSON.parse(await f.text()); } catch (e) { erro.push(f.name + ': arquivo ilegível'); continue; }
      var tipo = null;
      if (j && j.app === 'rcgado') { var a = mergeE(j.embarques || {}), b = mergeA(j.abate || {}); tot.rom += a.rom; tot.prog += a.prog; tot.aba += b.aba; tot.ja += a.ja + b.ja; tipo = 'backup geral'; }
      else if (j && Array.isArray(j.lotes)) { var c = mergeE(j); tot.rom += c.rom; tot.prog += c.prog; tot.ja += c.ja; tipo = 'backup do embarque'; }
      else if (j && j.recs && typeof j.recs === 'object') { var d = mergeA(j.recs); tot.aba += d.aba; tot.ja += d.ja; tipo = 'backup do abate'; }
      if (!tipo) erro.push(f.name + ': não é um backup do embarque nem do abate'); else out.push(f.name + ' (' + tipo + ')');
    }
    if (tot.rom || tot.prog || tot.aba) recarregar();
    var t = (out.length ? 'Lidos: ' + out.join(', ') + '\n' : '') + 'Entraram: ' + tot.rom + ' romaneios, ' + tot.prog + ' programações, ' + tot.aba + ' abates.' + (tot.ja ? '\n' + tot.ja + ' já estavam aqui e foram mantidos.' : '') + (erro.length ? '\n' + erro.join('\n') : '');
    await renderBkp(); msg(t, !erro.length);
  }

  function msg(t, ok) { var m = $('#bk-msg'); if (!m) return; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = t; m.hidden = false; }
  async function renderBkp() {
    var c = counts(), ult = +localStorage.getItem(LK) || 0, dias = ult ? Math.floor((Date.now() - ult) / 864e5) : null;
    var snaps = await snapList();
    $('#p-bkp').innerHTML = '<h1>Backup</h1><p class="muted">Tudo fica salvo neste aparelho. O backup é o seu seguro caso o app seja apagado ou você troque de celular.</p>' +
      '<div class="card"><h2>Neste aparelho</h2><div class="cnt"><div><b>' + c.rom + '</b><span>Romaneios</span></div><div><b>' + c.prog + '</b><span>Programações</span></div><div><b>' + c.aba + '</b><span>Abates</span></div></div>' +
      '<p class="small ' + (dias === null || dias > 7 ? 'aviso' : 'muted') + '" style="margin:10px 0 0">' + (dias === null ? 'Você ainda não salvou nenhum backup geral.' : dias === 0 ? 'Último backup geral: hoje.' : 'Último backup geral: há ' + dias + ' dia' + (dias > 1 ? 's' : '') + '.') + '</p></div>' +
      '<div class="card"><h2>Atualizar o app</h2><p class="small muted">Versão do app: <b id="ap-ver">…</b>. Se alguma novidade não apareceu, toque abaixo: ele baixa tudo de novo (seus dados ficam guardados).</p><button class="btn block" id="ap-upd">Atualizar agora</button></div>' +
      '<div class="card"><h2>Salvar backup geral</h2><p class="small muted">Um arquivo com embarques, programações e abates.</p><button class="btn block" id="bk-exp">Salvar backup geral</button></div>' +
      '<div class="card"><h2>Importar backup</h2><p class="small muted">Escolha o arquivo do backup geral, ou os backups antigos do embarque e do abate (pode escolher os dois de uma vez). O que já estiver aqui é mantido.</p><label class="btn alt block" for="bk-file">Escolher arquivo(s)</label><input id="bk-file" type="file" accept=".json,application/json" multiple hidden></div>' +
      '<div class="msg" id="bk-msg" hidden></div>' +
      '<div class="card"><h2>Cópias automáticas</h2><p class="small muted">O app guarda sozinho uma cópia por dia, dos últimos 30 dias, neste aparelho. Ela não substitui o backup em arquivo.</p>' +
      (snaps.length ? snaps.slice(0, 10).map(function (s) { return '<div class="snap"><span>' + esc(s.dia.replace('~', ' · ')) + '<br><span class="small muted">' + s.c.rom + ' rom. · ' + s.c.prog + ' prog. · ' + s.c.aba + ' abates</span></span><button class="btn alt sm" data-rest="' + esc(s.dia) + '">Restaurar</button></div>'; }).join('') : '<p class="small muted">Ainda não há cópias.</p>') + '</div>';
    $('#bk-exp').onclick = exportar;
    try { caches.keys().then(function (ks) { var el = $('#ap-ver'); if (el) el.textContent = ks.filter(function (k) { return k.indexOf('rc-gado') === 0; }).join(' ') || 'sem cache'; }); } catch (e) {}
    $('#ap-upd').onclick = function () {
      var bt = this; bt.textContent = 'Atualizando…'; bt.disabled = true;
      var fim = function () { location.replace(location.pathname + '?u=' + Date.now()); };
      Promise.resolve().then(function () { return navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0; })
        .then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0; })
        .then(fim, fim);
    };
    $('#bk-file').onchange = function (e) { if (e.target.files.length) importar(Array.from(e.target.files)); e.target.value = ''; };
    document.querySelectorAll('[data-rest]').forEach(function (b) { b.onclick = async function () {
      if (!confirm('Restaurar a cópia de ' + b.dataset.rest.replace('~', ' · ') + '? O que está no app agora será trocado (antes, o app guarda uma cópia de segurança).')) return;
      var s = await snapGet(b.dataset.rest); if (!s) { msg('Não consegui ler essa cópia.', false); return; }
      await snapSave('antes'); writeE(s.e); writeA(s.a); recarregar(); await renderBkp(); msg('Cópia restaurada.', true); }; });
  }

  var t0 = 'emb'; try { t0 = localStorage.getItem(TK) || 'emb'; } catch (e) {}
  go(t0);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
