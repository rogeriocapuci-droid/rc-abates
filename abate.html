/* Layout: no celular uma tela por vez (lista do dia, depois a ficha); no computador lista à esquerda e ficha à direita.
   Identidade igual à do RCapuci Leilões: verde-mata sobre papel claro, títulos em Roboto Slab, cifras e rótulos em âmbar. */
:root {
  --bg:#f1f4ee;--surface:#FFFFFF;--surface-2:#e8eee4;--sunk:#dfe7da;--ink:#15231a;--ink-2:#56665b;--line:#d2dacd;
--accent:#1d5f31;--accent-ink:#FFFFFF;--accent-text:#1d5f31;--accent-soft:#e1ece3;--amber:#A65C0E;--amber-soft:#F6E7D4;
--ok:#17703F;--ok-soft:#DCF0E4;--warn:#8F5400;--warn-soft:#FBEBC9;--bad:#B0321C;--bad-soft:#F9DEDC;
  --font-display:'Bitter',Georgia,serif;
  --font-body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1711;--surface:#17221a;--surface-2:#213026;--sunk:#0a110c;--ink:#e9f0e5;--ink-2:#9cae9f;--line:#2b3b2f;
--accent:#2f8c4a;--accent-ink:#FFFFFF;--accent-text:#7fd096;--accent-soft:#1c2e22;--amber:#E0A04E;--amber-soft:#362A18;
--ok:#62D394;--ok-soft:#16382A;--warn:#F0B955;--warn-soft:#3A2C0F;--bad:#FF948B;--bad-soft:#4A1D19;color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#0f1711;--surface:#17221a;--surface-2:#213026;--sunk:#0a110c;--ink:#e9f0e5;--ink-2:#9cae9f;--line:#2b3b2f;
--accent:#2f8c4a;--accent-ink:#FFFFFF;--accent-text:#7fd096;--accent-soft:#1c2e22;--amber:#E0A04E;--amber-soft:#362A18;
--ok:#62D394;--ok-soft:#16382A;--warn:#F0B955;--warn-soft:#3A2C0F;--bad:#FF948B;--bad-soft:#4A1D19;color-scheme:dark; }
:root[data-tema="claro"] { --bg:#f1f4ee;--surface:#FFFFFF;--surface-2:#e8eee4;--sunk:#dfe7da;--ink:#15231a;--ink-2:#56665b;--line:#d2dacd;
--accent:#1d5f31;--accent-ink:#FFFFFF;--accent-text:#1d5f31;--accent-soft:#e1ece3;--amber:#A65C0E;--amber-soft:#F6E7D4;
--ok:#17703F;--ok-soft:#DCF0E4;--warn:#8F5400;--warn-soft:#FBEBC9;--bad:#B0321C;--bad-soft:#F9DEDC; color-scheme: light; }
:root[data-tema="escuro"] { --bg:#0f1711;--surface:#17221a;--surface-2:#213026;--sunk:#0a110c;--ink:#e9f0e5;--ink-2:#9cae9f;--line:#2b3b2f;
--accent:#2f8c4a;--accent-ink:#FFFFFF;--accent-text:#7fd096;--accent-soft:#1c2e22;--amber:#E0A04E;--amber-soft:#362A18;
--ok:#62D394;--ok-soft:#16382A;--warn:#F0B955;--warn-soft:#3A2C0F;--bad:#FF948B;--bad-soft:#4A1D19;color-scheme:dark; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-inline: 14px; padding-block: 12px 0; -webkit-font-smoothing: antialiased;
}
button, input, a { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.wrap { max-width: 1180px; margin-inline: auto; }

/* topo */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 12px; }

    <input type="date" id="date" aria-label="Data do abate">
    <button class="btn sq" id="next" type="button" aria-label="Próximo dia">›</button>
    <button class="btn" id="today" type="button">Hoje</button>

  </div>

  <main class="layout">
    <section id="listPane" aria-label="Pecuaristas do dia">
      <div class="listhead">
        <h2>Pecuaristas do dia</h2>
        <button class="btn primary" id="add" type="button">+ Novo</button>
      </div>

    </section>

  </main>
  <section id="histPane" aria-label="Histórico de abates">
    <div class="histtools">
      <label class="f"><span>Buscar</span><input id="hq" type="search" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Pecuarista, frigorífico ou data"></label>
      <div class="seg" role="radiogroup" aria-label="Filtro do histórico">
        <input type="radio" name="hf" id="hf-todos" value="todos" checked><label for="hf-todos">Todos</label>
        <input type="radio" name="hf" id="hf-pend" value="pend"><label for="hf-pend">Com pendência</label>
      </div>
    </div>
    <p class="hint" id="histsum"></p>
    <div id="hist"></div>
  </section>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };

  var CATS = { boi: ['boi', 'bois', 'Boi'], vaca: ['vaca', 'vacas', 'Vaca'], novilha: ['novilha', 'novilhas', 'Novilha'], touro: ['touro', 'touros', 'Touro'] };
  var LEMB = [['prec', 'Precoce'], ['brin', 'Brincos'], ['pvf', 'Peso vivo fazenda'], ['pvg', 'Peso vivo frigorífico'], ['pm', 'Peso morto']];
  var OBS_PADRAO = '', OBS_ANTIGA = 'contagem do precoce conforme planilha do SIF';

  /* ---------- utilidades ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function shiftDate(s, delta) { var p = s.split('-').map(Number); var d = new Date(p[0], p[1] - 1, p[2] + delta); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function dateLabel(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }); }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function stable(o) {
    if (Array.isArray(o)) return '[' + o.map(stable).join(',') + ']';
    if (o && typeof o === 'object') return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + stable(o[k]); }).join(',') + '}';
    return JSON.stringify(o);
  }
  function num(s) {
    if (s == null) return null;
    s = String(s).trim().replace(/\s/g, '');
    if (!s) return null;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    var n = Number(s);
    return isFinite(n) ? n : null;
  }
  function fmtN(n, min, max) { return new Intl.NumberFormat('pt-BR', { minimumFractionDigits: min, maximumFractionDigits: max }).format(n); }
  var f0 = function (n) { return fmtN(n, 0, 2); };
  var f2 = function (n) { return fmtN(n, 2, 2); };
  var f1 = function (n) { return fmtN(n, 1, 1); };
  var p0 = function (n) { return fmtN(n, 0, 0); };
  function signed(n, fn) { return (n > 0 ? '+' : n < 0 ? '−' : '') + fn(Math.abs(n)); }

  /* ---------- modelo ---------- */
  function newLot(cat) { return { id: uid(), cat: cat || 'boi', qtd: '', pf: '', rend: '', pe: '', pc: '', pcm: 'media', partes: [], cur: ['', '', ''], si: '', sf: '', prec: '', bez: { g: '', m: '', p: '' }, lem: { prec: false, brin: false, pvf: false, pvg: false, pm: false } }; }
  function newRec(date) { return { id: uid(), data: date, frigorifico: '', pecuarista: '', ts: Date.now(), obs: OBS_PADRAO, lotes: [newLot()] }; }
  var MAXP = 4;
  /* Formato antigo: um único segundo rendimento (q2 e rend2) tirado do total de cabeças e do peso. Vira a parte 2, com o peso dividido por cabeça. */
  function migrarR2(l) {
    if (l.r2 === undefined && l.q2 === undefined && l.rend2 === undefined) return;
    var q = num(l.qtd), q2 = num(l.q2), pf = num(l.pf), tem = !!(l.r2 || String(l.q2 || '').trim() || String(l.rend2 || '').trim());
    if (tem && !(Array.isArray(l.partes) && l.partes.length)) {
      if (q && q2 && q2 > 0 && q2 < q && pf) {
        var pf1 = Math.round(pf * (q - q2) / q * 100) / 100, pf2 = Math.round((pf - pf1) * 100) / 100;
        l.partes = [{ q: String(q2), pf: fmtN(pf2, 0, 2), rend: String(l.rend2 || '') }];
        l.qtd = String(q - q2); l.pf = fmtN(pf1, 0, 2);
      } else if (String(l.q2 || '').trim() || String(l.rend2 || '').trim()) {
        l.partes = [{ q: String(l.q2 || ''), pf: '', rend: String(l.rend2 || '') }];
      }
    }
    delete l.r2; delete l.q2; delete l.rend2;
  }
  function normalize(r) {
    r.lotes = (r.lotes && r.lotes.length ? r.lotes : [newLot()]).map(function (l) {
      if (l.pcm == null) l.pcm = 'total';
      var base = newLot(l.cat);
      Object.keys(base).forEach(function (k) { if (l[k] == null) l[k] = base[k]; });
      l.bez = Object.assign({ g: '', m: '', p: '' }, l.bez || {});
      migrarR2(l);
      l.partes = (Array.isArray(l.partes) ? l.partes : []).slice(0, MAXP).map(function (p) { return { q: p && p.q != null ? p.q : '', pf: p && p.pf != null ? p.pf : '', rend: p && p.rend != null ? p.rend : '' }; });
      var hadLem = !!l.lem;
      l.lem = Object.assign({ prec: false, brin: false, pvf: false, pvg: false, pm: false }, l.lem || {});
      if (l.lem.pv) { l.lem.pvf = true; l.lem.pvg = true; }
      delete l.lem.pv;
      if (!hadLem && String(l.prec).trim() !== '') l.lem.prec = true;
      var cu = Array.isArray(l.cur) ? l.cur.slice(0, 3) : [];
      while (cu.length < 3) cu.push('');
      l.cur = cu;
      return l;
    });
    if (r.obs == null || r.obs === OBS_ANTIGA) r.obs = '';
    if (r.pecuarista == null) r.pecuarista = '';
    if (r.frigorifico == null) r.frigorifico = '';
    return r;
  }

  function calc(l) {
    var pe = num(l.pe), pcRaw = num(l.pc);
    var P = [{ q: num(l.qtd), pf: num(l.pf), rend: num(l.rend) }].concat((l.partes || []).map(function (p) { return { q: num(p.q), pf: num(p.pf), rend: num(p.rend) }; }));
    var multi = !!(l.partes && l.partes.length);
    var ativas = P.filter(function (p, i) { return i === 0 || p.q != null || p.pf != null || p.rend != null; });
    var somaP = function (key) { var t = null; ativas.forEach(function (p) { if (p[key] != null) t = (t || 0) + p[key]; }); return t; };
    var q = somaP('q'), pf = somaP('pf'), rend = P[0].rend, esp0 = null, parts = null;
    if (multi && ativas.length > 1) {
      var completo = ativas.every(function (p) { return p.q && p.pf && p.rend; });
      parts = ativas;
      if (completo) { esp0 = 0; ativas.forEach(function (p) { esp0 += p.pf * p.rend / 100; }); rend = pf ? esp0 / pf * 100 : null; }
      else rend = null;
    }
    var pcm = l.pcm === 'media', pcAuto = false;
    if (pcRaw != null && q) {
      if (pcm && pcRaw > 700) { pcm = false; pcAuto = true; }
      else if (!pcm && q >= 3 && pcRaw / q < 100) { pcm = true; pcAuto = true; }
    }
    var pc = pcRaw != null ? (pcm ? (q ? pcRaw * q : null) : pcRaw) : null;
    var prec = String(l.prec).trim() === '' ? null : num(l.prec);
    var si = num(l.si), sf = num(l.sf);
    var k = { parts: parts, pcAuto: pcAuto, lemPrec: !!(l.lem && l.lem.prec), q: q, pf: pf, pe: pe, pc: pc, pcRaw: pcRaw, pcm: pcm, rend: rend, prec: prec, si: si, sf: sf };
    k.peMed = q && pe ? pe / q : null;
    k.pfMed = q && pf ? pf / q : null;
    k.pcMed = q && pc ? (pcm ? pcRaw : pc / q) : null;
    k.pctFrig = pe && pc ? pc / pe * 100 : null;
    k.pctFaz = pf && pc ? pc / pf * 100 : null;
    k.pctPrec = q && prec != null ? prec / q * 100 : null;
    k.isPrec = q && prec != null ? prec * 100 > 60 * q : null;
    k.precMin = q ? Math.floor(q * 60 / 100) + 1 : null;
    k.quebra = pf && pe ? pf - pe : null;
    k.quebraPct = k.quebra != null ? k.quebra / pf * 100 : null;
    k.quebraCab = k.quebra != null && q ? k.quebra / q : null;
    k.esp = parts ? esp0 : (pf && rend ? pf * rend / 100 : null);
    k.difKg = k.esp != null && pc ? pc - k.esp : null;
    k.difPts = k.pctFaz != null && rend ? k.pctFaz - rend : null;
    k.espMed = k.esp != null && q ? k.esp / q : null;
    k.difMed = k.difKg != null && q ? k.difKg / q : null;
    return k;
  }
  function lotComplete(l) { var k = calc(l); return !!(k.q && k.pf && k.pe && k.pc); }
  function recStatus(r) {
    if (r.lotes.every(lotComplete)) return 'fechado';
    var any = r.lotes.some(function (l) { return num(l.pe) || num(l.pc); });
    return any ? 'faltam' : 'aguardando';
  }
  var STATUS = { fechado: ['Fechado', 'ok'], faltam: ['Faltam dados', 'warn'], aguardando: ['Aguardando abate', ''] };
  function summary(r) {
    var m = {};
    r.lotes.forEach(function (l) { var q = calc(l).q || 0; if (q) m[l.cat] = (m[l.cat] || 0) + q; });
    var out = Object.keys(m).map(function (c) { return m[c] + ' ' + (m[c] === 1 ? CATS[c][0] : CATS[c][1]); }).join(' · ');
    return out || 'Sem quantidade';
  }

  /* ---------- mensagem do WhatsApp ---------- */
  function lotLines(r, l) {
    var k = calc(l), cat = CATS[l.cat], L = [];
    var nome = (r.pecuarista || '').trim() || 'Pecuarista';
    L.push(nome + (k.q ? ' – ' + k.q + ' ' + (k.q === 1 ? cat[0] : cat[1]) : ''));
    if (k.pe && k.q) L.push('Peso Entrada: ' + f0(k.pe) + '/' + k.q + ' = ' + f2(k.peMed));
    if (k.pf && k.q) L.push('Peso Fazenda: ' + f0(k.pf) + '/' + k.q + ' = *' + f2(k.pfMed) + '*');
    if (k.espMed != null) L.push('Rendimento esperado: ' + (k.parts ? k.parts.map(function (p) { return p.q + ' a ' + f2(p.rend) + '%'; }).join(' + ') : f2(k.rend) + '%') + ' = ' + f2(k.espMed) + ' por cabeça');
    if (k.parts && k.esp != null) k.parts.forEach(function (p, n) { L.push('Parte ' + (n + 1) + ': ' + p.q + ' cab · ' + f0(p.pf) + ' × ' + f2(p.rend) + '% = ' + f2(p.pf * p.rend / 100) + ' kg'); });
    if (k.pcMed != null) L.push('Peso Frigorífico: ' + (k.pc && k.q ? f0(k.pc) + '/' + k.q + ' = ' : '') + '*' + f2(k.pcMed) + '*');
    if (k.pctFrig != null) L.push('% Frigorífico: ' + f2(k.pctFrig) + '%');
    if (k.pctFaz != null) L.push('% Fazenda: *' + f2(k.pctFaz) + '%*');
    if (k.difMed != null) {
      var dm = Math.round(k.difMed * 100) / 100;
      L.push('Resultado: *' + (dm > 0 ? 'Lucro ' : dm < 0 ? 'Prejuízo ' : 'Sem diferença ') + (dm !== 0 ? signed(dm, f2) + ' kg/cab' : '0,00 kg/cab') + '* (' + signed(k.difKg, f2) + ' kg no lote)');
    }
    if (k.si != null && k.sf != null) L.push('Sequência: ' + k.si + ' a ' + k.sf);
    if (l.lem && l.lem.prec && k.pctPrec != null) {
      L.push('Precoce: ' + k.prec + ' de ' + k.q + ' = ' + f2(k.pctPrec) + '%' + (k.isPrec ? ' (precoce)' : ' (não é precoce)'));
    }
    if (l.cat === 'vaca') {
      var g = num(l.bez.g), m = num(l.bez.m), p = num(l.bez.p);
      if (g || m || p) {
        L.push('Bezerros');
        if (g) L.push(g + (g === 1 ? ' grande' : ' grandes'));
        if (m) L.push(m + (m === 1 ? ' médio' : ' médios'));
        if (p) L.push(p + (p === 1 ? ' pequeno' : ' pequenos'));
      }
    }
    return L;
  }
  /* Resultado do lote: carcaças reais menos o esperado (peso da fazenda x rendimento esperado). */
  function resultChip(l, full) {
    var k = calc(l);
    if (k.difMed == null) return full && k.pc && !k.rend ? '<span class="chip">Informe o rendimento esperado</span>' : '<span class="chip none">Sem resultado</span>';
    var d = Math.round(k.difMed * 100) / 100;
    if (d === 0) return '<span class="chip">Sem diferença</span>';
    var win = d > 0;
    return '<span class="chip ' + (win ? 'ok' : 'bad') + '">' + (win ? 'Lucro ' : 'Prejuízo ') + signed(d, f2) + ' kg/cab' + (full ? ' · ' + signed(k.difKg, f2) + ' kg' : '') + '</span>';
  }
  function buildMsg(r) {
    var blocks = r.lotes.filter(function (l) { return calc(l).pcMed != null; }).map(function (l) { return lotLines(r, l).join('\n'); });
    var obs = (r.obs || '').trim();
    return blocks.length ? blocks.join('\n\n') + (obs ? '\n\nObs: ' + obs : '') : '';
  }

  /* ---------- armazenamento ---------- */
  function dbAdapter(db) {
    var col = db.collection('abates');
    return {
      kind: 'db',
      watchAll: function (cb, err) {
        return col.orderBy('data', 'desc').limit(500).onSnapshot(function (s) {
          cb(s.docs.map(function (d) { var o = clone(d.data()); o.id = d.id; return o; }));
        }, err);
      },
      save: function (rec) { var b = clone(rec); delete b.id; return col.doc(rec.id).set(b); },
      remove: function (id) { return col.doc(id).delete(); }
    };
  }
  function localAdapter() {
    var KEY = 'abate.v1', mem = { recs: {} }, subs = new Set();
    try { var raw = localStorage.getItem(KEY); if (raw) mem = JSON.parse(raw); } catch (e) {}
    if (!mem.recs) mem.recs = {};
    /* Cópia automática: 1 por dia (o estado mais recente do dia), guardada no aparelho, últimos 30 dias. */
    function idb() {
      return new Promise(function (res, rej) {
        if (!window.indexedDB) return rej();
        var q = indexedDB.open('abate-bkp', 1);
        q.onupgradeneeded = function () { q.result.createObjectStore('snaps', { keyPath: 'dia' }); };
        q.onsuccess = function () { res(q.result); }; q.onerror = function () { rej(); };
      });
    }
    function snapSave(tag) {
      var n = Object.keys(mem.recs).length; if (!n) return;
      var copia = clone(mem.recs), dia = todayStr() + (tag ? '~' + tag : '');
      idb().then(function (db) {
        var st = db.transaction('snaps', 'readwrite').objectStore('snaps');
        st.put({ dia: dia, ts: Date.now(), n: n, recs: copia });
        st.getAllKeys().onsuccess = function (e) { var ks = e.target.result.sort(); while (ks.length > 30) st.delete(ks.shift()); };
      }).catch(function () {});
    }
    function persist() {
      try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {}
      subs.forEach(function (f) { f(); });
      clearTimeout(persist.t); persist.t = setTimeout(function () { snapSave(); }, 800);
    }
    return {
      kind: 'local',
      watchAll: function (cb) {
        var f = function () { cb(Object.keys(mem.recs || {}).map(function (k) { return clone(mem.recs[k]); })); };
        subs.add(f); setTimeout(function () { f(); snapSave(); }, 0); return function () { subs.delete(f); };
      },
      save: function (rec) { mem.recs[rec.id] = clone(rec); persist(); return Promise.resolve(); },
      remove: function (id) { delete mem.recs[id]; persist(); return Promise.resolve(); },
      exportAll: function () { return clone(mem.recs); },
      importRecs: function (recs) {
        snapSave('antes'); var n = 0;
        Object.keys(recs).forEach(function (id) { var r = recs[id]; if (r && typeof r === 'object' && r.data && Array.isArray(r.lotes)) { r = clone(r); r.id = id; mem.recs[id] = r; n++; } });
        if (n) persist(); return n;
      },
      snaps: function () {
        return idb().then(function (db) {
          return new Promise(function (res) {
            var out = [], q = db.transaction('snaps').objectStore('snaps').openCursor();
            q.onsuccess = function () { var c = q.result; if (c) { var v = c.value; out.push({ dia: v.dia, ts: v.ts, n: v.n }); c.continue(); } else res(out.sort(function (a, b) { return a.dia < b.dia ? 1 : -1; })); };
            q.onerror = function () { res([]); };
          });
        }).catch(function () { return []; });
      },
      restore: function (dia) {
        return idb().then(function (db) {
          return new Promise(function (res) {
            var q = db.transaction('snaps').objectStore('snaps').get(dia);
            q.onsuccess = function () { var v = q.result; if (!v) { res(false); return; } snapSave('antes'); mem.recs = clone(v.recs); persist(); res(true); };
            q.onerror = function () { res(false); };
          });
        }).catch(function () { return false; });
      }
    };
  }

  /* ---------- estado ---------- */
  var S = { date: todayStr(), all: [], tab: 'dia', hq: '', hf: 'todos', open: { pec: false, frig: false }, q: { pec: '', frig: '' }, recs: [], openId: null, draft: null, isNew: false, dirty: false, saving: false, again: false, err: false, storage: null, unsub: null, loading: true, timer: null };

  /* ---------- cabeçalho e lista ---------- */
  function renderHeader() {
    $('#date').value = S.date;
    var dl = dateLabel(S.date); $('#dow').textContent = dl.charAt(0).toUpperCase() + dl.slice(1);
  }
  function setSync() {
    var el = $('#sync');
    var t = S.saving ? 'Salvando…' : S.err ? 'Não salvou · toque para tentar de novo' : !S.storage ? 'Conectando…' : S.storage.kind === 'db' ? 'Sincronizado' : 'Só neste aparelho';
    el.textContent = t;
    el.classList.toggle('err', S.err);
  }
  function lembLinha(l) {
    var on = LEMB.filter(function (x) { return l.lem && l.lem[x[0]]; }).map(function (x) { return x[1]; });
    return on.length ? '<span class="sm lemb">Lembrar: ' + esc(on.join(' · ')) + '</span>' : '';
  }
  function pendRom() {
    var rc = RCX(); if (!rc || S.loading) return '';
    var ont = shiftDate(S.date, -1), feito = {}, fp = {};
    S.all.forEach(function (r) { (r.roms || []).forEach(function (x) { feito[x.id] = 1; }); if (r.prog) fp[r.prog] = 1; });
    var ps = rc.romaneios().filter(function (r) { return r.data === ont && !feito[r.id]; });
    var pg = rc.progs().filter(function (p) { return p.data === ont && !p.pesado && !fp[p.id]; });
    if (!ps.length && !pg.length) return '';
    var bx = function (tit, sub, btn, attr) { return '<div class="cartao" style="border-color:var(--accent)"><b>' + tit + '</b><p class="hint" style="margin:2px 0 8px">' + sub + '</p><button type="button" class="btn primary rbtn" style="margin:0" ' + attr + '>' + btn + '</button></div>'; };
    return ps.map(function (r) { return bx('Embarcou ontem: ' + esc(r.pec || 'Sem pecuarista'), esc(r.fazs || '') + ' · ' + p0(r.cab) + ' cabeças · ' + p0(r.peso) + ' kg' + (r.frig ? ' · ' + esc(r.frig) : ''), 'Criar abate' + (r.frig ? ' no ' + esc(r.frig) : ''), 'data-act="rom-novo" data-id="' + esc(r.id) + '"'); }).join('') +
      pg.map(function (p) { return bx('Programado ontem: ' + esc(p.pec || 'Sem pecuarista'), p0(p.cab) + ' cabeças (' + p0(p.m) + ' machos · ' + p0(p.f) + ' fêmeas)' + (p.frig ? ' · ' + esc(p.frig) : '') + ' · ainda sem pesagem', 'Criar abate' + (p.frig ? ' no ' + esc(p.frig) : ''), 'data-act="prog-novo" data-id="' + esc(p.id) + '"'); }).join('');
  }
  function renderList() {
    var box = $('#cards');
    if (S.loading) { box.innerHTML = '<p class="empty">Carregando…</p>'; return; }
    if (!S.recs.length) {
      box.innerHTML = pendRom() + '<div class="empty"><p>Nenhum pecuarista lançado para ' + esc(dateLabel(S.date)) + '.</p><p>Toque em Novo para lançar o primeiro lote.</p></div>';
      return;
    }
    box.innerHTML = pendRom() + S.recs.map(function (r0) {
      var r = (S.draft && S.draft.id === r0.id) ? S.draft : r0;
      var st = STATUS[recStatus(r)];
      var lots = r.lotes.map(function (l, i) {
        var k = calc(l), cat = CATS[l.cat];

    var pre = null; list.forEach(function (r) { if (!pre && me && norm(r.pec) === me && done.indexOf(r.id) < 0) pre = r.id; });
    var el = document.createElement('div'); el.className = 'rmodal'; el.id = 'rmodal';
    el.innerHTML = '<div class="box"><b>Trazer pesos do romaneio</b><p class="hint">Escolha o(s) romaneio(s). As cabeças, o peso na fazenda e o rendimento combinado entram nos lotes. Depois você ajusta o que o frigorífico classificar diferente.</p>' +
      (list.length ? list.map(function (r) { var off = done.indexOf(r.id) >= 0; return '<label class="rom-opt' + (off ? ' off' : '') + '"><input type="checkbox" value="' + esc(r.id) + '"' + (off ? ' disabled' : r.id === pre ? ' checked' : '') + '><span><b>' + esc(r.pec || 'Sem pecuarista') + '</b><small>' + esc(isoBR(r.data)) + ' · ' + esc(r.fazs || 'sem fazenda') + '</small><small>' + p0(r.cab) + ' cabeças · ' + p0(r.peso) + ' kg' + (off ? ' · já trazido' : '') + '</small></span></label>'; }).join('') : '<p class="hint warn">Nenhum romaneio com pesos neste aparelho ainda.</p>') +
      '<div class="actions"><button type="button" class="btn grow" data-rm="x">Cancelar</button><button type="button" class="btn primary grow" data-rm="ok">Trazer</button></div></div>';
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-rm]');
      if (e.target === el || (b && b.dataset.rm === 'x')) { el.remove(); return; }
      if (b && b.dataset.rm === 'ok') {
        var ids = Array.prototype.slice.call(el.querySelectorAll('input:checked')).map(function (i) { return i.value; }), n = 0;
        ids.forEach(function (id) { var g = rc.grupos(id); if (g && addRom(S.draft, g)) n++; });
        el.remove();
        if (n) { touched(); renderEditor(); toast(n === 1 ? 'Romaneio trazido' : n + ' romaneios trazidos'); }
      }
    });
    document.body.appendChild(el);
  }
  function romUpdate() {
    var D = S.draft; if (!D) return;
    D.lotes.forEach(function (l, i) {
      var h = $('[data-rom="' + i + '"]'); if (!h || !l.src) return;
      var R = romSex(SEXO[l.cat]), k = calc(l), nm = SEXN[SEXO[l.cat]][0].toLowerCase();
      var t = 'Do romaneio: ' + p0(R.q) + ' ' + nm + ' (' + SEXN[SEXO[l.cat]][1] + ') · ' + f0(R.pf) + ' kg' + (R.q ? ' · média ' + f0(R.pf / R.q) + ' kg' : '') + '.';
      var dif = k.q != null && R.q && k.q !== R.q;
      if (dif) t += ' Neste lote: ' + p0(k.q) + '.';
      h.innerHTML = esc(t) + (dif && !(l.partes && l.partes.length) && D.lotes.filter(function (z) { return SEXO[z.cat] === SEXO[l.cat]; }).length === 1 ? ' <button type="button" class="link" data-act="rom-avg" data-l="' + i + '">Ajustar peso pela média</button>' : '');
    });
    var box = $('#romconf'); if (!box) return;
    if (!D.roms || !D.roms.length) { box.hidden = true; box.innerHTML = ''; return; }
    var A = { m: { q: 0, pf: 0 }, f: { q: 0, pf: 0 } };
    D.lotes.forEach(function (l) { var k = calc(l), x = A[SEXO[l.cat]]; if (x) { x.q += k.q || 0; x.pf += k.pf || 0; } });
    var tr = { q: 0, pf: 0 }, ta = { q: 0, pf: 0 };
    var rows = ['m', 'f'].map(function (sx) {
      var R = romSex(sx), a = A[sx]; if (!R.q && !a.q) return '';
      tr.q += R.q; tr.pf += R.pf; ta.q += a.q; ta.pf += a.pf;
      var d = a.q - R.q;
      return '<tr><td>' + SEXN[sx][0] + '<br><small>' + SEXN[sx][1] + '</small></td><td class="n">' + p0(R.q) + '<br>' + f0(R.pf) + ' kg</td><td class="n">' + p0(a.q) + '<br>' + f0(a.pf) + ' kg</td><td class="n">' + (d ? signed(d, p0) : '=') + '</td></tr>';
    }).join('');
    var dq = ta.q - tr.q, dp = ta.pf - tr.pf;
    box.hidden = false;
    box.innerHTML = '<h4 class="rot">Conferência com o romaneio</h4><p class="hint" style="margin:0 0 6px">' + esc(D.roms.map(function (r) { return r.nome; }).join(' + ')) + '</p>' +
      '<table class="rtab"><tr><th>Sexo</th><th class="n">Romaneio</th><th class="n">Abate</th><th class="n">Dif.</th></tr>' + rows +
      '<tr><td><b>Total</b></td><td class="n"><b>' + p0(tr.q) + '</b><br>' + f0(tr.pf) + ' kg</td><td class="n"><b>' + p0(ta.q) + '</b><br>' + f0(ta.pf) + ' kg</td><td class="n"><span class="chip ' + (dq || Math.abs(dp) > 0.5 ? 'warn' : 'ok') + '">' + (dq ? signed(dq, p0) + ' cab' : (Math.abs(dp) > 0.5 ? signed(Math.round(dp), p0) + ' kg' : 'ok')) + '</span></td></tr></table>' +
      '<p class="hint" style="margin:6px 0 0">Na fazenda só dá para separar macho e fêmea; vaca ou novilha é no olho. No frigorífico, divida as fêmeas entre vaca e novilha nos lotes. O total por sexo deve fechar com o romaneio.</p>';
  }
  window.RC_ABATE = {
    ligados: function (rid) { return S.all.filter(function (r) { return (r.roms || []).some(function (x) { return x.id === rid; }); }).map(function (r) { return { id: r.id, data: r.data, frigorifico: r.frigorifico }; }); },
    abrir: async function (id) { var r = S.all.find(function (x) { return x.id === id; }); if (!r) return false; await closeEditor(); setTab('dia'); if (S.date !== r.data) await changeDate(r.data); await openRec(id); return true; },
    novoDoRomaneio: async function (o) {
      var rc = RCX(), g = rc && rc.grupos(o.id); if (!g) return false;
      await closeEditor(); setTab('dia');
      if (S.date !== o.data) { S.date = o.data; renderHeader(); deriveDay(); }
      var rec = newRec(o.data); rec.frigorifico = o.frigorifico || g.frig || lastFrig(); rec.roms = []; addRom(rec, g);
      S.draft = rec; S.openId = rec.id; S.isNew = true; S.dirty = true;
      renderEditor(); renderList(); setView('edit'); window.scrollTo(0, 0); touched();
      return true;
    },
    frigorifico: function () { return lastFrig(); },
    atualizar: function () { if (!S.draft && !S.loading) renderList(); },
    novoDaProg: async function (pid, data) {
      var rc = RCX(), p = rc && rc.progs().filter(function (x) { return x.id === pid; })[0]; if (!p) return false;
      await closeEditor(); setTab('dia');
      if (S.date !== data) { S.date = data; renderHeader(); deriveDay(); }
      var rec = newRec(data); rec.frigorifico = p.frig || lastFrig(); rec.pecuarista = p.pec || ''; rec.prog = p.id;
      var dr = ''; S.draft = rec; S.openId = rec.id; S.isNew = true; S.dirty = true;
      renderEditor(); renderList(); setView('edit'); window.scrollTo(0, 0); touched();
      return true;
    }
  };
  window.addEventListener('storage', function (e) { if (e.key === 'rc_embarques_v1' || e.key === null) { try { RC_ABATE.atualizar(); } catch (x) {} } });

  /* ---------- dados do dia ---------- */
  async function changeDate(d) {
    if (d === S.date) return;
    await closeEditor();
    S.date = d; renderHeader(); deriveDay();
  }
  function deriveDay() {
    S.recs = S.all.filter(function (r) { return r.data === S.date; }).sort(function (a, b) { return (a.ts || 0) - (b.ts || 0); });
    onRecs();
  }
  function onRecs() {
    if (S.draft && !S.dirty && !S.saving) {
      var fresh = S.all.find(function (r) { return r.id === S.openId; });
      if (fresh) {
        var f = normalize(clone(fresh));
        if (stable(f) !== stable(S.draft)) { S.draft = f; renderEditor(); }
      } else if (!S.isNew) {
        S.draft = null; S.openId = null; renderEditor(); setView('list');
      }
    }
    renderList();
  }
  function onAll(docs) {
    S.loading = false;
    S.all = docs.map(normalize);
    deriveDay();
    updateSug();
    if (S.tab === 'hist') renderHist();
    scheduleBackup();
  }
  function watch() {
    if (S.unsub) S.unsub();
    S.loading = true; renderList();
    S.unsub = S.storage.watchAll(onAll, function () { S.loading = false; S.err = true; setSync(); renderList(); });
  }

  async function init() {
    renderHeader(); bind(); renderList(); renderEditor(); setSync();
    var db = null;
    try { if (window.claude && window.claude.use) db = await window.claude.use('db'); } catch (e) { db = null; }
    S.storage = db ? dbAdapter(db) : localAdapter();
    setSync(); renderBackup();
    watch();
  }
  init();
})();
</script>
